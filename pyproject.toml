[project]
name = "llm-agent-security"
version = "0.1.0"
description = "Security of LLM agents: encoded/indirect prompt injection, action-level attacks and defenses, and agent-safety evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Agent-harness + backbone deps land at S7 (AgentDojo / InjecAgent, LLM SDKs, etc.).
    # Encoder deps (copied from the sibling) get pinned when the copied module is decoupled.
    "agentdojo>=0.1.35",
    "boto3>=1.43.52",
    "homoglyphs>=2.0.4",
    "llm-utils",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Cluster-side ML deps kept OUT of the base install (torch is heavy; this arm runs on the cluster,
# not the laptop). Install with:  uv sync --extra classifiers  (cluster: uv pip install '.[classifiers]')
#  - agentdojo[transformers]: the classifier surface-form defenses (PIGuard, ProtectAI DeBERTa) load a
#    HF model via TransformersBasedPIDetector (transformers+torch).
#  - sentence-transformers: MELON's LOCAL tool-call embedder (melon.embedding=local) — keeps an
#    open-weight MELON run $0 (no OpenAI embedding calls). MELON with the default OpenAI embedder,
#    and the 'none'/'spotlighting' defenses, need none of this.
classifiers = [
    "agentdojo[transformers]>=0.1.35",
    "sentence-transformers>=3.0",
]

[tool.uv]

[tool.uv.sources]
llm-utils = { git = "https://github.com/vacantfury/llm_utils", rev = "v5.0.0" }
# uv is the package/project manager for this repo (global law: uv, not poetry).

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "bibtexparser>=1.4,<2",
    "pyyaml>=6",
]
