[project]
name = "llm-agent-security"
version = "0.1.0"
description = "Security of LLM agents: encoded/indirect prompt injection, action-level attacks and defenses, and agent-safety evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Agent-harness + backbone deps land at S7 (AgentDojo / InjecAgent, LLM SDKs, etc.).
    # Encoder deps (copied from the sibling) get pinned when the copied module is decoupled.
    "agentdojo>=0.1.35",
    "boto3>=1.43.52",
    "homoglyphs>=2.0.4",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Classifier-based surface-form defenses (PIGuard, ProtectAI DeBERTa) load a HF model via
# agentdojo's TransformersBasedPIDetector, which needs transformers+torch. Kept OUT of the base
# install (torch is heavy and this arm runs cluster-side, not on the laptop). Install with:
#   uv sync --extra classifiers      (or on the cluster: uv pip install '.[classifiers]')
# The 'none' / 'spotlighting' / 'melon' defenses need none of this.
classifiers = [
    "agentdojo[transformers]>=0.1.35",
]

[tool.uv]
# uv is the package/project manager for this repo (global law: uv, not poetry).

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "bibtexparser>=1.4,<2",
    "pyyaml>=6",
]
