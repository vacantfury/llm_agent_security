# The Smuggled-Actions experiment matrix (design.md §7). Read by src/harness/runner.py.
#
#   payload (attack)  ×  defense  ×  scaffold  ×  backbone (capability-ordered)  ×  AgentDojo suite
#
# YAML-config-not-magic-numbers (global law): every knob lives here; code reads it. Presets at the
# bottom carve subsets out of the full axes (the `pilot` preset is the gated first run, design §7).
# NOTHING here spends on its own — the runner only calls a model when invoked WITHOUT --dry-run.

benchmark_version: v1.2.2          # AgentDojo suite version (workspace/travel/banking/slack)
logdir: outputs/agent_injection/runs   # AgentDojo TraceLogger tree (gitignored); caches + resumes

# --- payload axis (attack names registered by src/attacks/encoded_injection.py) ----------------
# encoded_plain = the CONTROL (goal in cleartext, same carrier) — plain-vs-encoded isolates the
# encoding effect. The rest are the encoders (deterministic: cipher/homoglyph/code;
# LLM-based, need an encoder API key at run: set_theory/formal_logic/classical).
payloads:
  - encoded_plain          # control
  - encoded_cipher         # a: internal decode, base64  (pairs with tooldecode_base64)
  - encoded_caesar         # a: internal decode, caesar   (pairs with tooldecode_caesar)
  - encoded_code
  - encoded_homoglyph
  - encoded_set_theory
  - encoded_formal_logic
  - encoded_classical
  - tooldecode_base64      # b: tool-assisted self-decoding (attack b; needs convert_text tool)
  - tooldecode_caesar      # b: tool-assisted self-decoding
control_payload: encoded_plain

# --- tool-assisted-decode axis (attack b; src/attacks/tool_assisted_decode.py) ------------------
# The b payloads (tooldecode_*) nudge the agent to decode the smuggled instruction with its OWN
# benign tool (src/harness/agent_tools.convert_text) rather than in its head — the cleartext then
# lands only in the agent's tool output (a boundary surface-form defenses don't inspect) and the
# attack no longer depends on the backbone's own decode skill (design.md §4). The runner attaches
# convert_text to the suite ONLY for tooldecode_* cells (get_suite is a shared singleton). `pairs`
# maps each b payload to its matched a (same encoder, decoded in-head) for src/scoring's
# tool_decode_lift = ASR(b) − ASR(a).
tool_decode:
  tool_name: convert_text
  pairs:
    tooldecode_base64: encoded_cipher
    tooldecode_caesar: encoded_caesar

# --- defense axis (src/defenses/factory.py; classes tagged in defenses.yaml) --------------------
# Headline set = surface-form (fall) + behavioral (resists). protectai_deberta kept for comparison.
defenses:
  - none
  - spotlighting_with_delimiting   # surface-form (prompt)   — reuse
  - tool_filter                    # isolation (OpenAI-only) — reuse; content-agnostic contrast
  - piguard                        # surface-form (classifier, published) — needs [classifiers] extra
  - melon                          # behavioral (resistant baseline)
comparison_defenses:
  - protectai_deberta              # surface-form (classifier, non-published AgentDojo default)

# --- scaffold axis (design §3) ------------------------------------------------------------------
# native   = the provider's structured tool API (OpenAI/Anthropic/Google)   — free
# prompted = tool schemas serialized into the prompt (PromptingLLM/LocalLLM) — free; the open-weight path
# react    = a built planner->executor BasePipelineElement                    — BUILD (design §3.3), not yet
# "default" (used by presets) = each backbone's own default_scaffold (holds scaffold fixed per backbone).
scaffolds:
  - native
  - prompted
# react: deferred to the full-matrix generality axis (see src/harness/backbones.py SCAFFOLDS).

# --- AgentDojo suites ---------------------------------------------------------------------------
suites:
  - workspace
  - travel
  - banking
  - slack

# --- backbone axis (capability-ordered; the axis IS the headline finding) -----------------------
# capability_rank orders low->high — the ONLY load-bearing field for the scaling analysis.
# `model` strings are TUNABLE EXAMPLES: set them to currently-available snapshots at run time
# (they drift; do not treat as pinned). Frontier arms bypass AgentDojo's ModelsEnum via hand-built
# LLM objects (the factory accepts a pre-built llm); the open-weight arm is served on the
# NEU/employer cluster via vLLM (near-zero cost, resource-acquisition rule) at $VLLM_BASE_URL.
backbones:
  - {id: qwen2.5-7b,    provider: vllm,      model: "Qwen/Qwen2.5-7B-Instruct",    default_scaffold: prompted, capability_rank: 1, base_url_env: VLLM_BASE_URL}
  - {id: llama3.1-8b,   provider: vllm,      model: "meta-llama/Llama-3.1-8B-Instruct", default_scaffold: prompted, capability_rank: 2, base_url_env: VLLM_BASE_URL}
  - {id: gpt-4o-mini,   provider: openai,    model: "gpt-4o-mini-2024-07-18",      default_scaffold: native,   capability_rank: 3}
  - {id: qwen2.5-72b,   provider: vllm,      model: "Qwen/Qwen2.5-72B-Instruct",   default_scaffold: prompted, capability_rank: 4, base_url_env: VLLM_BASE_URL}
  - {id: gpt-4o,        provider: openai,    model: "gpt-4o-2024-08-06",           default_scaffold: native,   capability_rank: 5}
  - {id: claude-sonnet, provider: anthropic, model: "claude-3-5-sonnet-20241022",  default_scaffold: native,   capability_rank: 6}
  - {id: gemini-2.5-pro,provider: google,    model: "gemini-2.5-pro",              default_scaffold: native,   capability_rank: 7}
  - {id: gpt-5,         provider: openai,    model: "gpt-5",                       default_scaffold: native,   capability_rank: 8, reasoning_effort: medium}
  - {id: claude-opus,   provider: anthropic, model: "claude-opus-4-20250514",      default_scaffold: native,   capability_rank: 9}

# --- run controls -------------------------------------------------------------------------------
force_rerun: false        # false = reuse AgentDojo's on-disk cache (resume); true = recompute
max_user_tasks: null      # null = all; an int caps per suite (for cheap subsets)
max_injection_tasks: null

# --- presets: named subsets of the axes above ---------------------------------------------------
presets:
  # The gated first run (design §7): ~6 capability-spread backbones × {control + 2 encoders} ×
  # {no-defense + spotlighting} × each backbone's default scaffold × a workspace subset (~tens of
  # cases). Decides (a) does encoding lift ASR and (b) does the capability trend exist, before the
  # full matrix. Open-weight arm ~free on cluster; API arm ~$100-800 (proposal §10). GATED on owner-go.
  pilot:
    backbones: [qwen2.5-7b, llama3.1-8b, gpt-4o-mini, qwen2.5-72b, gpt-4o, claude-sonnet]
    payloads: [encoded_plain, encoded_set_theory, encoded_code]
    defenses: [none, spotlighting_with_delimiting]
    scaffolds: [default]
    suites: [workspace]
    max_user_tasks: 10
    max_injection_tasks: 4

  # The b (tool-assisted self-decoding) pilot (proposal §4 direction, 2026-07-22). Capability-spread
  # backbones × {control, a-internal, b-tool} for base64 × the defense-class split (surface-form
  # fall vs behavioral resist) × default scaffold × workspace subset. Tests the b signature: b works
  # even at LOW capability (tool decodes regardless of the backbone's own decode skill), where a
  # internal-decode should fall off — the tool_decode_lift largest at low capability. GATED on owner-go.
  b_pilot:
    backbones: [qwen2.5-7b, llama3.1-8b, gpt-4o-mini, gpt-4o, claude-sonnet]
    payloads: [encoded_plain, encoded_cipher, tooldecode_base64]
    defenses: [none, spotlighting_with_delimiting, piguard, melon]
    scaffolds: [default]
    suites: [workspace]
    max_user_tasks: 10
    max_injection_tasks: 4

  # A no-spend smoke test: 1 cheap backbone, control payload, no defense, tiny subset.
  smoke:
    backbones: [gpt-4o-mini]
    payloads: [encoded_plain]
    defenses: [none]
    scaffolds: [default]
    suites: [workspace]
    max_user_tasks: 2
    max_injection_tasks: 1

  # A no-spend b smoke: b payload assembles + tool round-trips (verify via --dry-run).
  b_smoke:
    backbones: [gpt-4o-mini]
    payloads: [encoded_plain, encoded_cipher, tooldecode_base64, tooldecode_caesar]
    defenses: [none]
    scaffolds: [default]
    suites: [workspace]
    max_user_tasks: 2
    max_injection_tasks: 1

  # --- STAGED LADDER (owner asked to split the heavy pilot into smaller go/no-go parts, 2026-07-22) ----
  # Each stage answers ONE question on the SMALLEST sufficient slice and is its OWN approval-gated run
  # (report GPU+$+time, get go — CLAUDE.md §Conventions). Run cheapest-first; STOP if a stage is negative.
  # Stages 0-2 need only small open-weight models (1-2 GPUs, ~$0, minutes); the capability SWEEP (s3) is
  # the only heavy stage and waits until 0-2 show the effect AND the cluster's open-model list is known.

  # s0 — mechanism: does an agent complete the injected action at all, and does b's tool actually fire?
  # 1 small model, no defense, control vs a(internal decode) vs b(tool decode). ~8 cases/cell.
  s0_mechanism:
    backbones: [qwen2.5-7b]
    payloads: [encoded_plain, encoded_cipher, tooldecode_base64]
    defenses: [none]
    scaffolds: [default]
    suites: [workspace]
    max_user_tasks: 4
    max_injection_tasks: 2

  # s1 — evasion: do a and b get past ONE surface-form defense (spotlighting)? 2 small open models
  # (guard against model-specificity), control + a + b × {none, spotlighting}. ~18 cases/cell.
  s1_evasion:
    backbones: [qwen2.5-7b, llama3.1-8b]
    payloads: [encoded_plain, encoded_cipher, tooldecode_base64]
    defenses: [none, spotlighting_with_delimiting]
    scaffolds: [default]
    suites: [workspace]
    max_user_tasks: 6
    max_injection_tasks: 3

  # s2 — defense-class split: surface-form (spotlighting, piguard) FALL vs behavioral (melon) RESISTS,
  # for both a and b. small + one larger open model. Needs the [classifiers] extra (piguard) + a LOCAL
  # MELON embedder (else MELON leaks small OpenAI embedding $). ~24 cases/cell.
  s2_defsplit:
    backbones: [qwen2.5-7b, qwen2.5-72b]
    payloads: [encoded_plain, encoded_cipher, tooldecode_base64]
    defenses: [none, spotlighting_with_delimiting, piguard, melon]
    scaffolds: [default]
    suites: [workspace]
    max_user_tasks: 8
    max_injection_tasks: 3

  # s3 — capability sweep (the ONLY heavy stage): ASR vs capability on the surviving payload×defense
  # subset. Fill the backbone list once the cluster's open-weight inventory is known (needs >2 capability
  # tiers: 7-8B -> ~32B -> 72B -> a near-frontier open anchor). Open-weight ladder placeholder for now.
  s3_capability:
    backbones: [qwen2.5-7b, llama3.1-8b, qwen2.5-72b]
    payloads: [encoded_plain, encoded_cipher, tooldecode_base64]
    defenses: [none, spotlighting_with_delimiting]
    scaffolds: [default]
    suites: [workspace]
    max_user_tasks: 10
    max_injection_tasks: 4
